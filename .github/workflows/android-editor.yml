name: Android and editor
on: [push, pull_request]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLEANFRAME_PUBLIC_FONTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check:addons
      - run: node scripts/check-android-browser.mjs
      - run: node scripts/check-options-browser.mjs
      - run: node scripts/check-spotify-browser.mjs
      - run: npm run check:editor
      - run: node scripts/check-software-browser.mjs
      - run: python scripts/test-editor-tools.py && python scripts/test-editor-workspace.py
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: ./android/gradlew -p android --no-daemon testDebugUnitTest lintDebug assembleDebug
