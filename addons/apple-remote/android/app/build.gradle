plugins { id 'com.android.application' }

android {
    namespace 'com.cleanframe.addon.appleremote'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.cleanframe.addon.appleremote'
        minSdk 31
        targetSdk 35
        versionCode 21
        versionName '0.1.1'
    }
    buildFeatures { aidl true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'io.github.rburgst:okhttp-digest:3.1.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'com.squareup.okhttp3:okhttp-tls:4.12.0'
}

// Package source provenance and available upstream redistribution notices.
android.sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/notices'))
def syncNotices = tasks.register('syncNotices', Copy) {
    from('../..') { include 'LICENSE', 'NOTICE.md', 'PROVENANCE.json', 'Cargo.lock', 'vendor/**/LICENSE', 'vendor/**/*LICENSE.txt', 'vendor/**/*NOTICE*.md', 'vendor/**/CLEANFRAME-FORK.md' }
    into(layout.buildDirectory.dir('generated/notices/licenses'))
}
tasks.named('preBuild').configure { dependsOn(syncNotices) }
