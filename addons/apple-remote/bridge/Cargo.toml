[package]
name = "cleanframe-remote"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
atv-core = { path = "../vendor/atv-core" }
chromiacast = { path = "../vendor/chromiacast", features = ["android-tv"] }
jni = "0.21"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
serde_json = "1"
rand = "0.8"
hex = "0.4"
uuid = { version = "1", features = ["v4", "v5"] }
